    <title>skein — client-side network graph viewer</title>
    <!-- Inline so the icon costs no request and stays same-origin (§7). Declaring
         one at all is what stops Chromium falling back to GET /favicon.ico, whose
         404 landed in the console and made explore.spec's zero-error assertion
         flaky whenever a run was slow enough for the lazy fetch to arrive first.
         `img-src 'self' data:` already permits this in all three CSP copies. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b12'/%3E%3Cg stroke='%233a3f55' stroke-width='2'%3E%3Cpath d='M9 9 23 16M23 16 9 23M9 9 9 23'/%3E%3C/g%3E%3Cg fill='%239fb6ff'%3E%3Ccircle cx='9' cy='9' r='3.5'/%3E%3Ccircle cx='9' cy='23' r='3.5'/%3E%3C/g%3E%3Ccircle cx='23' cy='16' r='4' fill='%237fd4a3'/%3E%3C/svg%3E"
    />
  </head>

  </body>
</html>
