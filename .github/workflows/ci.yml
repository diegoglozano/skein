name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # skein-native is macOS-only by construction (docs/DECISIONS.md D15): it
      # owns an NSWindow via winit and presents to a CAMetalLayer via wgpu.
      # Excluded here and covered by the `native` job below, so a Linux runner
      # is not asked to build a desktop GPU app.
      - run: cargo clippy --workspace --all-targets --exclude skein-native -- -D warnings
      - run: cargo test --workspace --exclude skein-native
      - run: cargo check -p skein-wasm --target wasm32-unknown-unknown
      # Regression-ratio gate (docs/DECISIONS.md D5). Warn-only until the
      # baseline has been regenerated on this runner class with --update.
      - run: cargo run --release --example bench | node bench/compare-bench.mjs --warn-only

  # The macOS-only native front end (D15). Its unit tests — camera maths, the
  # mmap store round-trip, the edge sampler — are pure logic and need no GPU;
  # anything that does need one is measured by hand on the reference laptop,
  # because headless GPU numbers are not evidence (D3/D5).
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p skein-native --all-targets -- -D warnings
      - run: cargo test -p skein-native

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # `clustered` is needed by the WebGL2-fallback layout gate: it coarsens
      # to two levels, so prolongation is exercised (tiny does not). `small` is
      # needed by the draw-budget gate: it is the smallest preset with more
      # edges than the budget, so it is the smallest one where sampling is
      # observable at all (D15).
      - run: node bench/generate-fixtures.mjs tiny clustered small
      # The browser download is ~130 MB and the run never varies for a given
      # @playwright/test version, so it is cached on the resolved version rather
      # than re-fetched every push. `--with-deps` installs apt packages outside
      # ~/.cache/ms-playwright, so it still runs on a hit — but it is the fast
      # half.
      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: tests
      # Privacy gate (§7) + the app suite on the tiny fixture. The M0 cosmos.gl
      # spike is opt-in (`npm run spike -w tests`) — D7 is decided and
      # SwiftShader numbers are not performance evidence (D3/D5).
      - run: npm run test -w tests
