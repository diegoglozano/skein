name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p skein-wasm --target wasm32-unknown-unknown
      # Regression-ratio gate (docs/DECISIONS.md D5). Warn-only until the
      # baseline has been regenerated on this runner class with --update.
      - run: cargo run --release --example bench | node bench/compare-bench.mjs --warn-only

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # `clustered` is needed by the WebGL2-fallback layout gate: it coarsens
      # to two levels, so prolongation is exercised (tiny does not).
      - run: node bench/generate-fixtures.mjs tiny clustered
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: tests
      # Privacy gate (§7) + functional spike run on the tiny fixture.
      # SwiftShader numbers are not performance evidence (D3/D5).
      - run: npm run test -w tests
        env:
          SPIKE_SIM_CAP_MS: "30000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-metrics
          path: bench/results/
          if-no-files-found: ignore
