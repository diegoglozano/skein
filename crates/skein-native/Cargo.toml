[package]
name = "skein-native"
# The `-alpha` is load-bearing, not modesty. dist marks a release prerelease
# when the version carries a suffix, and GitHub excludes prereleases from
# `/releases/latest` — which is the URL README.md's install command depends on.
# Ship this as a full release and it becomes "latest", and
# `releases/latest/download/skein-installer.sh` starts 404ing for everyone.
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native macOS front end for skein: winit + wgpu, no browser (DECISIONS.md D15)"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
memmap2 = "0.9.11"
pollster = "1.0.1"
skein-core = { path = "../skein-core" }
wgpu = "30.0.0"
winit = "0.30.13"

[package.metadata.dist]
# Released, but on its own tag and its own two targets — never with `skein`.
#
# Both halves matter. dist's default for a package with a binary is dist-able
# *for every target in dist-workspace.toml*, which for this crate meant Windows
# and linux-musl builds of a macOS-only front end (D15) that the Linux CI jobs
# deliberately skip. And because an unqualified `v<x.y.z>` tag announces every
# dist-able package at that version, leaving the versions to converge would one
# day sweep this crate into a `skein` release by accident.
#
# The versions are therefore deliberately independent, and each app is released
# by a package-qualified tag: `v0.3.0` for skein, `skein-native-v0.1.0-alpha.1`
# for this one. See the version field above for why the suffix is required.
dist = true
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# No PowerShell installer: there is no Windows target to install.
installers = ["shell"]
