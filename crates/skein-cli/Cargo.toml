[package]
# The package is `skein`, not `skein-cli`, even though it lives in
# crates/skein-cli alongside its sibling libraries: dist names every release
# artifact after the package, so this is what makes the installer
# `skein-installer.sh` rather than `skein-cli-installer.sh`. The directory keeps
# the -cli suffix to read consistently next to skein-core and skein-wasm.
name = "skein"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Serves the skein web app from a local static binary"
readme = "../../README.md"

[dependencies]
tiny_http = "0.12"
# Serving, not compressing: the bundle is compressed at build time (build.rs).
# This is here for the client that does not offer `br`, and for the round-trip
# test on the embedded table.
brotli = { version = "8", default-features = false, features = ["std"] }

[build-dependencies]
brotli = { version = "8", default-features = false, features = ["std"] }

[package.metadata.dist]
dist = true
